<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cheeks — Admin (Presentation Demo)</title>
  <meta name="description" content="Admin interface for Cheeks Bar & Grill event management and booking system." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .admin-wrap{max-width:960px;margin:0 auto;padding:24px}
    .admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .admin-grid .full{grid-column:1/-1}
    .admin-card{border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:16px;background:rgba(0,0,0,.18)}
    label{display:block;font-size:.9rem;opacity:.9;margin:10px 0 6px}
    input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.25);color:#fff}
    textarea{min-height:90px}
    .admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .admin-actions button{cursor:pointer}
    .status{margin-top:10px;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;font-size:.9rem;white-space:pre-wrap}
    iframe{width:100%;min-height:520px;border:1px solid rgba(255,255,255,.15);border-radius:14px;background:#fff}
    .small-note{opacity:.8;font-size:.9rem;margin-top:6px}
  </style>
</head>
<body>
  <div class="admin-wrap">
    <h1>Admin — Event Sheet + BOOKED (Demo)</h1>
    <p class="small-note">Use this page during the owner meeting so you don't need curl. Nothing here exposes repo/admin credentials. This posts to <code>/api/mark-booked</code> using <code>x-admin-token</code>.</p>

    <div class="admin-card">
      <div class="admin-grid">
        <div class="full">
          <label>ADMIN_TOKEN</label>
          <input id="token" type="password" placeholder="Paste ADMIN_TOKEN (Vercel env var)" />
        </div>

        <div>
          <label>Inquiry / Event ID</label>
          <input id="id" placeholder="e.g., inq_20251228_001 (optional; will autogenerate)" />
        </div>
        <div>
          <label>Source (src)</label>
          <input id="src" placeholder="e.g., demo, table-tent, facebook" value="demo" />
        </div>

        <div>
          <label>Name</label>
          <input id="name" placeholder="Customer name" />
        </div>
        <div>
          <label>Phone</label>
          <input id="phone" placeholder="###-###-####" />
        </div>

        <div>
          <label>Email</label>
          <input id="email" placeholder="customer@email.com" />
        </div>
        <div>
          <label>Event Type</label>
          <input id="eventType" placeholder="Birthday / Reunion / Work Party" />
        </div>

        <div>
          <label>Event Date</label>
          <input id="eventDate" placeholder="YYYY-MM-DD" />
        </div>
        <div>
          <label>Event Time</label>
          <input id="eventTime" placeholder="6:00 PM" />
        </div>

        <div>
          <label>Guests</label>
          <input id="guests" type="number" min="1" max="80" value="20" />
        </div>
        <div>
          <label>Package</label>
          <select id="package">
            <option value="A">A — Apps + Drinks</option>
            <option value="B" selected>B — Limited Buffet</option>
            <option value="C">C — Premium Dinner / Buyout</option>
          </select>
        </div>

        <div>
          <label>Deposit (text)</label>
          <input id="deposit" placeholder="$200" value="$200" />
        </div>
        <div>
          <label>Minimum Spend (text)</label>
          <input id="minimumSpend" placeholder="$800" value="$800" />
        </div>

        <div class="full">
          <label>Notes / Requests</label>
          <textarea id="notes" placeholder="Allergies, buffet notes, arrival window, tab rules, decorations, etc."></textarea>
        </div>
      </div>

      <div class="admin-actions">
        <button class="btn" id="previewBtn" type="button">Preview Event Sheet</button>
        <button class="btn" id="bookBtn" type="button">Mark BOOKED (Deposit Paid)</button>
        <button class="btn" id="fillBtn" type="button">Fill Sample</button>
        <button class="btn" id="clearBtn" type="button">Clear</button>
      </div>

      <div class="status" id="status"></div>
    </div>

    <h2 style="margin-top:18px">Preview</h2>
    <iframe id="previewFrame" title="Event Sheet Preview"></iframe>
  </div>

  <script src="/admin.js"></script>
</body>
</html>

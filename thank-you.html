<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Request Received | Cheeks Bar & Grill</title>
  <meta name="description" content="Your event inquiry has been received. We'll contact you soon to confirm details." />
  <meta name="robots" content="noindex,follow" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header" role="banner">
    <div class="wrap header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="10" fill="url(#brandGradient)"/>
            <path d="M20 10C15 10 12 13 12 18c0 5 3 8 6 8s6-3 6-8c0-5-3-8-6-8z" fill="rgba(255,255,255,.9)"/>
            <path d="M15 25c-2 0-3.5 1.5-3.5 3.5V32h17v-3.5c0-2-1.5-3.5-3.5-3.5H15z" fill="rgba(255,255,255,.8)"/>
            <defs>
              <linearGradient id="brandGradient" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="rgba(224,177,91,.25)"/>
                <stop offset="100%" stop-color="rgba(224,177,91,.08)"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">Cheeks Bar and Grill</div>
          <div class="brand-tag">Wausau, Wisconsin</div>
        </div>
      </div>
      <nav class="nav" aria-label="Primary">
        <div class="navlinks">
          <a href="/">Home</a>
          <a class="pill" href="tel:+17153934026">(715) 393-4026</a>
        </div>
      </nav>
    </div>
  </header>

  <main id="main" class="main" role="main">
    <section class="section">
      <div class="wrap">
        <h1>Request received ✅</h1>
        <p class="lead">Thanks for reaching out. We’ll contact you soon to confirm details.</p>

        <div class="card" style="margin-top:14px">
          <p style="margin:0 0 6px"><strong>Your reference ID:</strong> <span id="ref">—</span></p>
          <p class="muted" style="margin:0">Not booked until deposit is paid.</p>
        </div>

        <div class="cta-grid" style="margin-top:16px">
          <a class="btn btn-primary" href="tel:+17153934026">Call to finalize</a>
          <a class="btn btn-secondary" href="/">Back to home</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function(){
      try {
        const u = new URL(window.location.href);
        const id = u.searchParams.get('id');
        const refEl = document.getElementById('ref');
        if (refEl) {
          refEl.textContent = id ? id : '—';
        }
      } catch(e) {
        // Silently fail if URL parsing is not supported
      }
    })();
  </script>
</body>
</html>
